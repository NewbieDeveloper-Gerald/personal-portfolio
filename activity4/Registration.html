<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="Design.css">
</head>
<body>

    <header class="heading">
        <div>
            <h1>My Personal Website </h1> 
            <p> Welcome to my Personal Student Portal</p>
        </div>
       
    </header>

    <nav class="navigation">
        <a href="Home.html"> Home </a>
        <a href="Registration.html"> Registration </a>
        <a href="Grades.html"> Grades </a>
        <a href="Profile.html"> Profile </a>
     </nav>

    <div class="Reg">
        <h1 class="regname"> Student Registration Form</h1>
            <form>
    
                Student Name <br>
                <input type="text" placeholder="Enter Name">
                <br> Email <br>
                <input type="text" placeholder="Enter Email">
                <br> Password <br>
                <input type="text" placeholder="Enter Password">
        
                <br> Gender <br>
                <input type="radio" value="Male"> Male
                <input type="radio" value="Male"> Female
        
                <br> Course <br>
                <select name="dropdown">
                    <option value="BSIT"> BSIT </option>
                    <option value="BSCS"> BSCS </option>
                    <option value="BSTM"> BSTM </option>
                    <option value="BSOA"> BSOA </option>
                </select>
        
                <br> Skills <br>
                <input type="checkbox"> HTML
                <input type="checkbox"> CSS
                <input type="checkbox"> JAVASCRIPT
        
                <br> Profile Picture <br>
                <input type="file" name="Choose File" accept="image/*">
        
                <br> Address <br>
                <textarea rows="5" cols="50" placeholder="Address Here "> </textarea>
        
                <br> 
                <input type="submit"> 

             </form>     
    </div>
   

<footer class="bot">
    <p> @ 2026 My Personal Website</p>
</footer>

    
</body>
</html>
