<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Demo</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body{
            text-align: center;
            margin-top: 7%;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color:khaki;
            font-size: 50px;
        }
        button{
            background-color: burlywood;
            border-radius: 50px;
            padding: 35px 75px;
            border: none;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }
        button:hover{
            background-color: darksalmon;
        }
        #message{
            font-weight: bold;
        }
        .container{
            display: flex;
            justify-content: center;
            gap: 10px;
            border-radius: 10%;


            .con1{
                background-color: brown;
            }

            .con2{
                background-color: tomato;
            }
            .con3{
                background-color: springgreen;
            }
        }
    </style>

</head>
<body>

    <h1>JavaScript Demo</h1>

    <button id="change-btn">1</button>

    <button id="new-color-btn">2</button>

    <p id="message">
        Waiting....
    </p>

    <div class="container">
        <div class="con1">   <p id="profile">Profile</p></div>
        <div class="con2">  <p id="grade">Grades</p></div>
        <div class="con3">  <p id="schedule">Schedules</p></div>
    </div>

  
   
   


    <script src="script.js"></script>
    
</body>
</html>
