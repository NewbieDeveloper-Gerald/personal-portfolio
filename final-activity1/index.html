<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card-container">
            <div class="logo-img"> <img id="img" src="image/picture.jpg" alt="" >  </div>
            
            <div class="text-namecourse"> 
                <h1 id="name-output">Gerald</h1> 
                <p>Bachelor of Science in Information Technology</p> 
            </div>
            

            <input id="name-input" type="text" placeholder="type your nickname"> <br>    
            
            <select name="" id="select-year">
                <option id="Selectyear" >Select Year</option>
                <option id="1st">1st Year</option>
                <option id="2nd">2nd Year</option>
                <option id="3rd">3rd Year</option>
                <option id="4th">4th Year</option>
            </select> <br>

            <button id="one-click">Click</button> 
            <button id="double-click">Double Click</button> 
            <button id="press-click">Press & Hold</button> 
            
            <div class="text-interaction">
                <h3  id="interaction">Waiting for interaction...</h3>
            </div >
            
        </div>
    </div>
    
    
    <script src="script.js"></script>
</body>
</html>
